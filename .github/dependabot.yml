# Minor and patch updates are batched into one PR per ecosystem.
# Major updates still arrive as individual PRs for manual review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
